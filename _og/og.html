<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#0d0d0c;color:#f2efe8;font-family:Inter,sans-serif;position:relative;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
.b1,.b2{position:absolute;border-radius:50%;filter:blur(110px);opacity:.55;z-index:0}
.b1{width:620px;height:620px;background:#7a2e12;top:-260px;right:-120px}
.b2{width:520px;height:520px;background:#1d3a6e;bottom:-300px;left:-160px}
.top,.mid,.bot{position:relative;z-index:1}
.top{display:flex;align-items:center;gap:18px}
.top img{width:76px;height:76px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px #161614,0 0 0 3px rgba(255,255,255,.2)}
.top p{font-size:28px;font-weight:500}
.top span{color:#9b978f;font-weight:400}
h1{font-weight:500;font-size:92px;line-height:1;letter-spacing:-.045em;max-width:15ch}
h1 em{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:#ff7a4d;letter-spacing:-.02em}
.bot{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:20px;color:#9b978f}
.bot b{color:#f2efe8;font-weight:500}
</style></head><body>
<div class="b1"></div><div class="b2"></div>
<div class="top"><img src="../img/diego-square.jpg"><p>Zurita Talent <span>— Boutique recruiting firm</span></p></div>
<h1 class="mid">Recruiting systems, built from <em>0&nbsp;to&nbsp;100</em></h1>
<div class="bot"><span>Recruiting ops · Sourcing · Embedded · Executive search</span><b>dzs97.github.io</b></div>
</body></html>
